<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Plant Care</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        <link rel="stylesheet" href="css/styles.css" />
    </head>
    <body>
        <div class="container py-4">
            <h1 class="text-center mb-5">Plant Care</h1>
            <section id="today" class="container py-5 mb-4 bg-today">
                <h2 class="text-center">Today</h2>
                <div id="today-plants" class="text-center"></div>
            </section>
            <section
                id="upcoming"
                class="container py-5 mb-4 bg-plant-secondary"
            >
                <h2 class="text-center">Next 3 days:</h2>
                <div id="upcoming-plants" class="text-center"></div>
            </section>
            <section
                id="allplants"
                class="container py-5 mb-4 bg-plant-tertiary"
            >
                <h2 class="text-center">All plants</h2>
                <div id="all-plants" class="text-center"></div>
            </section>
            <div class="text-center my-4">
                <a href="plant.html" class="btn btn-primary">Add Plant</a>
            </div>
        </div>
        <script type="module" src="js/display.js"></script>
    </body>
</html>
