<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Plant Form</title>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="css/styles.css" />
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    </head>
    <body>
        <div class="container py-4">
            <h1 class="text-center mb-5">Plant Form</h1>

            <form id="plantForm" class="bg-plant-secondary p-4 rounded">
                <div class="mb-3">
                    <label for="name" class="form-label">Name:</label>
                    <input
                        placeholder="e.g. Cactus"
                        type="text"
                        id="name"
                        name="name"
                        class="form-control"
                    />
                </div>
                <div class="mb-3">
                    <label for="species" class="form-label">Species:</label>
                    <select id="species" name="species" class="form-select">
                        <option value="">Select a species</option>
                        <option value="calathea">Calathea</option>
                        <option value="cactus">Cactus</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="lastWatered" class="form-label"
                        >Last Watered:</label
                    >
                    <input
                        type="date"
                        id="lastWatered"
                        name="lastWatered"
                        class="form-control"
                    />
                </div>
                <input type="submit" value="Submit" class="btn btn-primary" />
            </form>
        </div>
        <script type="module" src="js/addplant.js"></script>
    </body>
</html>
